<!-- quiz-create.component.html -->
<div class="container mt-4">
  <h2>Create New Quiz</h2>
  <form [formGroup]="quizForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
    <!-- Title Field -->
    <div class="mb-4">
      <label for="title" class="form-label">Quiz Title <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="title" formControlName="title" 
             [ngClass]="{'is-invalid': (submitted || quizForm.get('title')?.touched) && quizForm.get('title')?.invalid}">
      <div *ngIf="(submitted || quizForm.get('title')?.touched) && quizForm.get('title')?.invalid" 
           class="invalid-feedback">
        <div *ngIf="quizForm.get('title')?.errors?.['required']">Title is required</div>
        <div *ngIf="quizForm.get('title')?.errors?.['minlength']">
          Title must be at least 3 characters long
        </div>
      </div>
    </div>

    <!-- Description Field -->
    <div class="mb-4">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" formControlName="description" rows="3"></textarea>
    </div>

    <!-- Questions -->
    <div formArrayName="questions" class="questions-container">
      <div *ngFor="let question of questions.controls; let i = index" 
           [formGroupName]="i" 
           class="card mb-4 border-0 shadow-sm">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Question {{i + 1}}</h5>
          <button type="button" class="btn btn-outline-danger btn-sm" 
                  (click)="removeQuestion(i)" 
                  *ngIf="questions.length > 1"
                  [disabled]="loading">
            <i class="bi bi-trash"></i> Remove
          </button>
        </div>
        <div class="card-body">
          <!-- Question Text -->
          <div class="mb-3">
            <label [for]="'questionText' + i" class="form-label">Question Text <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [id]="'questionText' + i" formControlName="text"
                   [ngClass]="{'is-invalid': (submitted || question.get('text')?.touched) && question.get('text')?.invalid}">
            <div *ngIf="(submitted || question.get('text')?.touched) && question.get('text')?.invalid" 
                 class="invalid-feedback">
              <div *ngIf="question.get('text')?.errors?.['required']">Question text is required</div>
              <div *ngIf="question.get('text')?.errors?.['minlength']">
                Question must be at least 5 characters long
              </div>
            </div>
          </div>

          <!-- Options -->
          <div formArrayName="options" class="options-container">
            <label class="form-label">Options <span class="text-danger">*</span></label>
            <div *ngFor="let option of question.get('options')?.controls; let j = index" 
                 [formGroupName]="j" class="mb-2 option-item">
              <div class="input-group">
                <span class="input-group-text">{{option.get('label')?.value}}.</span>
                <input type="text" class="form-control" formControlName="text"
                       [placeholder]="'Option ' + option.get('label')?.value"
                       [ngClass]="{'is-invalid': (submitted || option.get('text')?.touched) && option.get('text')?.invalid}">
                <div class="input-group-text">
                  <input class="form-check-input mt-0" type="radio" 
                         [value]="option.get('label')?.value" 
                         [formControl]="question.get('correctAnswer')"
                         [name]="'correctAnswer' + i">
                </div>
              </div>
              <div *ngIf="(submitted || option.get('text')?.touched) && option.get('text')?.invalid" 
                   class="invalid-feedback d-block">
                Option text is required
              </div>
            </div>
            <div *ngIf="(submitted || question.get('options')?.touched) && question.get('options')?.errors?.['atLeastOneOptionRequired']" 
                 class="text-danger small mt-1">
              At least one option is required
            </div>
          </div>

          <!-- Correct Answer -->
          <div class="mt-3">
            <label class="form-label">Correct Answer <span class="text-danger">*</span></label>
            <div *ngIf="(submitted || question.get('correctAnswer')?.touched) && question.get('correctAnswer')?.invalid" 
                 class="text-danger small mb-2">
              Please select the correct answer
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="d-flex justify-content-between align-items-center mb-5 form-actions">
      <button type="button" class="btn btn-outline-primary" (click)="addQuestion()" [disabled]="loading">
        <i class="bi bi-plus-circle"></i> Add Question
      </button>
      <div>
        <button type="button" class="btn btn-outline-secondary me-2" (click)="onCancel()" [disabled]="loading">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading || quizForm.invalid">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          {{ loading ? 'Creating...' : 'Create Quiz' }}
        </button>
      </div>
    </div>
  </form>
</div>
